# Mac에서 태그 push → Windows exe 자동 빌드 + GitHub Release 업로드
# 사용법:
#   1) timer-desktop/package.json version 올리기 (예: 1.0.1)
#   2) git commit & push
#   3) git tag v1.0.1 && git push origin v1.0.1
#
# 필요 Secrets (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY  (또는 SUPABASE_SERVICE_ROLE_KEY)

name: Timer Desktop Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (예: v1.0.1). 비우면 package.json version 사용"
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    working-directory: timer-desktop

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: timer-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for packaging
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "Missing secret SUPABASE_URL"
            exit 1
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            fi
            if [ -n "$SUPABASE_ANON_KEY" ]; then
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            fi
          } > .env
          if [ -z "$SUPABASE_ANON_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Need SUPABASE_ANON_KEY or SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi

      - name: Sync version from tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.tag }}" ]; then
            VER="${{ inputs.tag }}"
            VER="${VER#v}"
          else
            VER=$(node -p "require('./package.json').version")
          fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          npm version "$VER" --no-git-tag-version --allow-same-version
          echo "Building version $VER"

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mnf-timer-windows
          path: |
            timer-desktop/dist/*.exe
            timer-desktop/dist/latest.yml
            timer-desktop/dist/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: MNF Timer ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            timer-desktop/dist/*.exe
            timer-desktop/dist/latest.yml
            timer-desktop/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
